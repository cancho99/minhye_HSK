<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 단어 플래시카드 & 시험</title>
<style>
  :root{
    --bg:#f6f4ef;
    --card:#ffffff;
    --ink:#2b2620;
    --sub:#8a8377;
    --accent:#c0392b;
    --accent2:#1f6f5c;
    --line:#e7e2d8;
    --wrong:#c0392b;
    --right:#1f6f5c;
    --warn:#b8860b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 80px;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 0 6px;
  }
  header h1{font-size:19px;margin:0;letter-spacing:-0.3px;}
  header .count{font-size:12px;color:var(--sub);}
  nav{
    display:flex;gap:6px;overflow-x:auto;padding:6px 0 14px;
    border-bottom:1px solid var(--line);margin-bottom:16px;
  }
  nav button{
    flex:0 0 auto;
    background:transparent;border:1px solid var(--line);
    padding:8px 12px;border-radius:999px;font-size:13px;
    color:var(--sub);cursor:pointer;white-space:nowrap;
  }
  nav button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin-bottom:14px;
  }
  h2{font-size:16px;margin:0 0 10px;}
  p.desc{color:var(--sub);font-size:13px;line-height:1.6;margin:0 0 14px;}

  textarea{
    width:100%;min-height:220px;
    border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:13px;font-family:monospace;
    resize:vertical;background:#fbfaf7;
  }
  input[type=text]{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:15px;background:#fff;
  }
  .btn{
    display:inline-block;border:none;border-radius:10px;
    padding:11px 18px;font-size:14px;font-weight:600;
    cursor:pointer;background:var(--ink);color:#fff;
  }
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:var(--accent);}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  th{color:var(--sub);font-weight:600;font-size:12px;}
  td input{padding:6px 8px;font-size:13px;}
  .tiny{font-size:11px;color:var(--sub);}
  .empty{
    text-align:center;color:var(--sub);padding:40px 10px;font-size:13px;line-height:1.7;
  }

  /* flashcard */
  .flash-stage{
    display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 10px 10px;
  }
  .flash-card{
    width:100%;max-width:420px;min-height:220px;
    background:#fff;border:1px solid var(--line);border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;cursor:pointer;text-align:center;gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.03);
  }
  .flash-hanzi{font-size:56px;font-weight:700;letter-spacing:1px;}
  .flash-level{font-size:11px;color:var(--sub);background:var(--bg);padding:2px 8px;border-radius:999px;}
  .flash-pinyin{font-size:22px;color:var(--accent2);font-weight:600;}
  .flash-meaning{font-size:16px;color:var(--ink);line-height:1.5;}
  .flash-hint{font-size:12px;color:var(--sub);}
  .progress{font-size:12px;color:var(--sub);}

  /* quiz */
  .quiz-hanzi{font-size:52px;font-weight:700;text-align:center;margin:10px 0 4px;}
  .quiz-level{text-align:center;color:var(--sub);font-size:12px;margin-bottom:18px;}
  .quiz-section{margin-bottom:18px;}
  .quiz-label{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:8px;}
  .pinyin-feedback{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:8px;}
  .pinyin-feedback.right{background:#e9f5f1;color:var(--right);}
  .pinyin-feedback.warn{background:#fbf3e0;color:var(--warn);}
  .pinyin-feedback.wrong{background:#fbeceb;color:var(--wrong);}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    background:#fff;cursor:pointer;font-size:14px;text-align:left;
  }
  .choice.selected{border-color:var(--ink);}
  .choice.correct{border-color:var(--right);background:#e9f5f1;color:var(--right);font-weight:600;}
  .choice.incorrect{border-color:var(--wrong);background:#fbeceb;color:var(--wrong);font-weight:600;}
  .score-badge{
    display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;
    background:var(--bg);color:var(--ink);
  }

  .wrong-item{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);padding:10px 0;
  }
  .wrong-item:last-child{border-bottom:none;}
  .wrong-hanzi{font-size:22px;font-weight:700;min-width:56px;}
  .wrong-meta{flex:1;padding:0 10px;font-size:13px;}
  .wrong-meta .py{color:var(--accent2);font-weight:600;}
  .wrong-meta .mn{color:var(--sub);}

  select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;background:#fff;}
  label.opt{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ 저장소 ============ */
const STORAGE_WORDS = 'hsk-words-v1';
const STORAGE_WRONG = 'hsk-wrong-v1';
const STORAGE_NEXTID = 'hsk-nextid-v1';

let state = {
  screen: 'home',
  words: [],
  wrongIds: [],
  nextId: 1,
  loaded: false,
  // flashcard
  fcOrder: [],
  fcIndex: 0,
  fcFlipped: false,
  fcShuffled: false,
  // quiz
  quizPool: [],
  quizIndex: 0,
  quizMode: 'all', // all | wrong
  quizTotal: 0,
  quizScoreRight: 0,
  quizPinyinInput: '',
  quizPinyinChecked: false,
  quizPinyinResult: null, // 'right' | 'warn' | 'wrong'
  quizChoices: [],
  quizSelected: null,
  quizAnswered: false,
  quizJustWrong: false,
  quizSessionOver: false,
  importText: '',
  // manage
  confirmingClear: false,
  addWordError: '',
  saveMessage: '',
};

async function loadAll(){
  try{
    const w = localStorage.getItem(STORAGE_WORDS);
    state.words = w ? JSON.parse(w) : [];
  }catch(e){ state.words = []; }
  try{
    const ww = localStorage.getItem(STORAGE_WRONG);
    state.wrongIds = ww ? JSON.parse(ww) : [];
  }catch(e){ state.wrongIds = []; }
  try{
    const ni = localStorage.getItem(STORAGE_NEXTID);
    state.nextId = ni ? JSON.parse(ni) : 1;
  }catch(e){ state.nextId = 1; }
  state.loaded = true;
  render();
}

async function saveWords(){
  try{ localStorage.setItem(STORAGE_WORDS, JSON.stringify(state.words)); }catch(e){}
}
async function saveWrong(){
  try{ localStorage.setItem(STORAGE_WRONG, JSON.stringify(state.wrongIds)); }catch(e){}
}
async function saveNextId(){
  try{ localStorage.setItem(STORAGE_NEXTID, JSON.stringify(state.nextId)); }catch(e){}
}

/* ============ 파싱 ============ */
function parseLine(raw){
  let line = raw.trim();
  if(!line) return null;
  line = line.replace(/^\d+\s*/, '').replace(/^[□☐]\s*/, '').trim();
  const hanziMatch = line.match(/^([\u4e00-\u9fff·…]+(?:\s[\u4e00-\u9fff·…]+)*)/);
  if(!hanziMatch) return null;
  const hanzi = hanziMatch[1].trim();
  let rest = line.slice(hanziMatch[0].length).trim();
  const hangulIdx = rest.search(/[\uAC00-\uD7A3]/);
  if(hangulIdx === -1) return null;
  let pinyinPart = rest.slice(0, hangulIdx).trim();
  let meaning = rest.slice(hangulIdx).trim();
  let level = null;
  const levelMatch = pinyinPart.match(/([1-4])\s*급/);
  if(levelMatch){
    level = levelMatch[1];
    pinyinPart = pinyinPart.replace(/[1-4]\s*급/,'').trim();
  }
  if(!pinyinPart) return null;
  return {hanzi, pinyin: pinyinPart, meaning, level};
}

function parseBulkText(text){
  const lines = text.split('\n');
  const results = [];
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;
    const parsed = parseLine(line);
    if(parsed){
      results.push(parsed);
    } else if(results.length > 0){
      // 이어지는 뜻 설명으로 간주하고 이전 단어에 붙임
      results[results.length-1].meaning += ' ' + line;
    }
  }
  return results;
}

function importParsedWords(parsed){
  let added = 0;
  for(const p of parsed){
    if(!p.hanzi || !p.pinyin || !p.meaning) continue;
    state.words.push({
      id: state.nextId++,
      hanzi: p.hanzi,
      pinyin: p.pinyin,
      meaning: p.meaning,
      level: p.level || null,
    });
    added++;
  }
  saveWords();
  saveNextId();
  return added;
}

/* ============ 유틸 ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function stripTones(py){
  const map = {'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e',
    'ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o',
    'ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v'};
  return py.toLowerCase().split('').map(c=>map[c]||c).join('').replace(/[^a-z]/g,'');
}
function comparePinyin(input, correct){
  const inClean = input.trim().toLowerCase().replace(/\s+/g,'');
  const corClean = correct.trim().toLowerCase().replace(/\s+/g,'');
  if(inClean === corClean) return 'right';
  if(stripTones(inClean) === stripTones(corClean)) return 'warn';
  return 'wrong';
}
function findWordById(id){ return state.words.find(w=>w.id===id); }

/* ============ 렌더링 ============ */
function el(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.firstElementChild;
}

function render(){
  const root = document.getElementById('app');
  if(!state.loaded){
    root.innerHTML = `<div class="empty">불러오는 중...</div>`;
    return;
  }
  root.innerHTML = `
    <header>
      <h1>📚 HSK 단어장</h1>
      <span class="count">단어 ${state.words.length}개 · 오답 ${state.wrongIds.length}개</span>
    </header>
    <nav id="nav"></nav>
    <div id="screen"></div>
  `;
  const nav = document.getElementById('nav');
  const tabs = [
    ['home','홈'],
    ['import','단어 가져오기'],
    ['manage','단어장 관리'],
    ['flash','플래시카드'],
    ['quiz','시험보기'],
    ['wrong','오답노트'],
  ];
  tabs.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    if(state.screen===key) b.classList.add('active');
    b.onclick = ()=>{ goTo(key); };
    nav.appendChild(b);
  });

  const s = document.getElementById('screen');
  if(state.screen==='home') s.innerHTML = renderHome();
  else if(state.screen==='import') s.innerHTML = renderImport();
  else if(state.screen==='manage') s.innerHTML = renderManage();
  else if(state.screen==='flash') s.innerHTML = renderFlash();
  else if(state.screen==='quiz') s.innerHTML = renderQuiz();
  else if(state.screen==='wrong') s.innerHTML = renderWrong();

  attachHandlers();
}

function goTo(key){
  state.screen = key;
  if(key==='flash') setupFlash();
  if(key==='quiz'){ state.quizSessionOver = true; } // 모드 선택 화면부터
  render();
}

/* ---------- 홈 ---------- */
function renderHome(){
  return `
    <div class="card">
      <h2>사용 순서</h2>
      <p class="desc">
        1) <b>단어 가져오기</b>에서 갖고 있는 단어 목록(한자·병음·뜻)을 붙여넣어 단어장을 만드세요.<br>
        2) <b>플래시카드</b>로 한자를 보고 병음·뜻을 떠올려 보세요.<br>
        3) <b>시험보기</b>에서 한자를 보고 병음을 직접 입력하고, 뜻은 4지선다로 풀어보세요.<br>
        4) 틀린 문제는 자동으로 <b>오답노트</b>에 쌓이고, 오답만 따로 다시 풀 수 있어요.
      </p>
      <div class="row">
        <button class="btn" onclick="goTo('import')">단어 가져오기</button>
        <button class="btn secondary" onclick="goTo('flash')" ${state.words.length===0?'disabled':''}>플래시카드 시작</button>
        <button class="btn secondary" onclick="goTo('quiz')" ${state.words.length===0?'disabled':''}>시험 시작</button>
      </div>
    </div>
    ${state.words.length===0 ? `<div class="card"><p class="desc" style="margin:0">아직 등록된 단어가 없어요. 저작권 보호 자료(교재 등)는 개인 학습용으로 직접 붙여넣어 사용해 주세요.</p></div>` : ''}
  `;
}

/* ---------- 가져오기 ---------- */
function renderImport(){
  return `
    <div class="card">
      <h2>텍스트로 단어 가져오기</h2>
      <p class="desc">
        아래 형식 중 하나로 한 줄에 한 단어씩 붙여넣으세요.<br>
        · <b>일반 교재 형식</b> 예) <code>阿姨 3급 āyí 명 아주머니, 이모</code><br>
        · <b>간단 형식</b> 예) <code>阿姨, āyí, 아주머니</code> (쉼표 또는 탭 구분)<br>
        번호나 체크박스(□)는 있어도 자동으로 무시됩니다.
      </p>
      <textarea id="importArea" placeholder="여기에 단어 목록을 붙여넣으세요">${state.importText||''}</textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnParse">미리보기 / 추가하기</button>
        <button class="btn ghost" id="btnClearImport">지우기</button>
      </div>
      <div id="importResult"></div>
    </div>
  `;
}

/* ---------- 단어장 관리 ---------- */
function renderManage(){
  const rows = state.words.map(w=>`
    <tr data-id="${w.id}">
      <td><input type="text" class="edit-hanzi" value="${escapeAttr(w.hanzi)}" style="width:70px"></td>
      <td><input type="text" class="edit-pinyin" value="${escapeAttr(w.pinyin)}" style="width:90px"></td>
      <td><input type="text" class="edit-meaning" value="${escapeAttr(w.meaning)}" style="width:100%"></td>
      <td><button class="btn ghost delete-word" style="padding:4px 8px;font-size:12px">삭제</button></td>
    </tr>
  `).join('');
  return `
    <div class="card">
      <h2>새 단어 추가</h2>
      <div class="row">
        <input type="text" id="addHanzi" placeholder="한자" style="max-width:100px">
        <input type="text" id="addPinyin" placeholder="병음" style="max-width:120px">
        <input type="text" id="addMeaning" placeholder="뜻">
        <button class="btn" id="btnAddWord">추가</button>
      </div>
      ${state.addWordError?`<p class="tiny" style="color:var(--wrong);margin:8px 0 0">${state.addWordError}</p>`:''}
    </div>
    <div class="card">
      <div class="row between">
        <h2 style="margin:0">단어 목록 (${state.words.length})</h2>
        ${state.words.length>0? (
          state.confirmingClear
          ? `<span class="row" style="gap:6px">
               <span class="tiny" style="color:var(--wrong)">정말 전체 삭제할까요?</span>
               <button class="btn danger" id="btnClearAllConfirm" style="padding:6px 12px;font-size:12px">삭제 확정</button>
               <button class="btn ghost" id="btnClearAllCancel" style="padding:6px 12px;font-size:12px">취소</button>
             </span>`
          : `<button class="btn danger" id="btnClearAll" style="padding:6px 12px;font-size:12px">전체 삭제</button>`
        ) : ''}
      </div>
      ${state.words.length===0 ? `<div class="empty">등록된 단어가 없습니다. '단어 가져오기'에서 먼저 추가해 주세요.</div>` : `
      <div style="overflow-x:auto">
      <table>
        <tr><th>한자</th><th>병음</th><th>뜻</th><th></th></tr>
        ${rows}
      </table>
      </div>
      <div class="row" style="margin-top:12px;align-items:center">
        <button class="btn secondary" id="btnSaveEdits">수정 내용 저장</button>
        ${state.saveMessage?`<span class="tiny" style="color:var(--right)">${state.saveMessage}</span>`:''}
      </div>
      `}
    </div>
  `;
}
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

/* ---------- 플래시카드 ---------- */
function setupFlash(){
  const order = state.words.map(w=>w.id);
  state.fcOrder = state.fcShuffled ? shuffle(order) : order;
  state.fcIndex = 0;
  state.fcFlipped = false;
}
function renderFlash(){
  if(state.words.length===0){
    return `<div class="card"><div class="empty">단어를 먼저 등록해 주세요.</div></div>`;
  }
  if(state.fcOrder.length===0) setupFlash();
  const id = state.fcOrder[state.fcIndex];
  const w = findWordById(id);
  if(!w) return `<div class="card"><div class="empty">단어를 찾을 수 없습니다.</div></div>`;
  return `
    <div class="card">
      <div class="row between">
        <label class="opt"><input type="checkbox" id="fcShuffle" ${state.fcShuffled?'checked':''}> 랜덤 순서</label>
        <span class="progress">${state.fcIndex+1} / ${state.fcOrder.length}</span>
      </div>
      <div class="flash-stage">
        <div class="flash-card" id="flashCard">
          ${state.fcFlipped ? `
            <div class="flash-hanzi" style="font-size:34px">${w.hanzi}</div>
            <div class="flash-pinyin">${w.pinyin}</div>
            <div class="flash-meaning">${w.meaning}</div>
          ` : `
            ${w.level?`<div class="flash-level">HSK ${w.level}급</div>`:''}
            <div class="flash-hanzi">${w.hanzi}</div>
            <div class="flash-hint">탭하면 병음·뜻이 보여요</div>
          `}
        </div>
        <div class="row">
          <button class="btn secondary" id="fcPrev">이전</button>
          <button class="btn secondary" id="fcFlip">뒤집기</button>
          <button class="btn" id="fcNext">다음</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- 시험 ---------- */
function startQuiz(mode){
  let pool = mode==='wrong'
    ? state.wrongIds.slice()
    : state.words.map(w=>w.id);
  pool = shuffle(pool);
  if(pool.length===0){
    state.quizSessionOver = true;
    render();
    return;
  }
  state.quizMode = mode;
  state.quizPool = pool;
  state.quizIndex = 0;
  state.quizTotal = pool.length;
  state.quizScoreRight = 0;
  state.quizSessionOver = false;
  prepQuizQuestion();
  render();
}
function prepQuizQuestion(){
  state.quizPinyinInput = '';
  state.quizPinyinChecked = false;
  state.quizPinyinResult = null;
  state.quizSelected = null;
  state.quizAnswered = false;
  state.quizJustWrong = false;
  const id = state.quizPool[state.quizIndex];
  const correct = findWordById(id);
  if(!correct) return;
  const others = state.words.filter(w=>w.id!==id && w.meaning!==correct.meaning);
  const distractors = shuffle(others).slice(0,3).map(w=>w.meaning);
  const opts = shuffle([correct.meaning, ...distractors]);
  state.quizChoices = opts;
}
function renderQuiz(){
  if(state.words.length===0){
    return `<div class="card"><div class="empty">단어를 먼저 등록해 주세요.</div></div>`;
  }
  if(state.quizSessionOver){
    const hasWrong = state.wrongIds.length>0;
    const finished = state.quizPool.length>0 && state.quizIndex>=state.quizPool.length;
    return `
      <div class="card">
        <h2>시험 모드 선택</h2>
        ${finished ? `
          <p class="desc">결과: <span class="score-badge">${state.quizScoreRight} / ${state.quizTotal} 맞음</span></p>
        ` : ''}
        <div class="row">
          <button class="btn" id="quizStartAll">전체 단어로 시험</button>
          <button class="btn secondary" id="quizStartWrong" ${hasWrong?'':'disabled'}>오답만 다시 풀기 (${state.wrongIds.length})</button>
        </div>
      </div>
    `;
  }
  const id = state.quizPool[state.quizIndex];
  const w = findWordById(id);
  if(!w){
    state.quizIndex++;
    if(state.quizIndex>=state.quizPool.length){ state.quizSessionOver=true; render(); return ''; }
    prepQuizQuestion();
  }
  const pyResult = state.quizPinyinResult;
  const pyMsgMap = {
    right: `정확해요! 정답: <b>${w.pinyin}</b>`,
    warn: `성조만 다르거나 비슷해요. 정답: <b>${w.pinyin}</b>`,
    wrong: `다시 확인해보세요. 정답: <b>${w.pinyin}</b>`,
  };
  return `
    <div class="card">
      <div class="row between">
        <span class="tiny">${state.quizMode==='wrong'?'오답 복습':'전체 시험'}</span>
        <span class="progress">${state.quizIndex+1} / ${state.quizTotal} · 맞음 ${state.quizScoreRight}</span>
      </div>
      <div class="quiz-hanzi">${w.hanzi}</div>
      ${w.level?`<div class="quiz-level">HSK ${w.level}급</div>`:'<div style="margin-bottom:10px"></div>'}

      <div class="quiz-section">
        <div class="quiz-label">① 병음을 입력하세요</div>
        <input type="text" id="pinyinInput" placeholder="예: nǐ hǎo" value="${escapeAttr(state.quizPinyinInput)}" ${state.quizPinyinChecked?'disabled':''}>
        ${!state.quizPinyinChecked ? `<div class="row" style="margin-top:8px"><button class="btn secondary" id="checkPinyin" style="padding:8px 14px;font-size:13px">확인</button></div>` : ''}
        ${pyResult ? `<div class="pinyin-feedback ${pyResult}">${pyMsgMap[pyResult]}</div>` : ''}
      </div>

      <div class="quiz-section">
        <div class="quiz-label">② 알맞은 뜻을 고르세요</div>
        <div class="choices">
          ${state.quizChoices.map((choice,i)=>{
            let cls = 'choice';
            if(state.quizAnswered){
              if(choice===w.meaning) cls += ' correct';
              else if(choice===state.quizSelected) cls += ' incorrect';
            } else if(choice===state.quizSelected){
              cls += ' selected';
            }
            return `<button class="${cls}" data-choice="${i}" ${state.quizAnswered?'disabled':''}>${choice}</button>`;
          }).join('')}
        </div>
      </div>

      <div class="row" style="margin-top:6px">
        <button class="btn" id="nextQuestion" ${(state.quizPinyinChecked && state.quizAnswered) ? '' : 'disabled'}>다음 문제</button>
        <button class="btn ghost" id="stopQuiz">시험 종료</button>
      </div>
    </div>
  `;
}

/* ---------- 오답노트 ---------- */
function renderWrong(){
  if(state.wrongIds.length===0){
    return `<div class="card"><div class="empty">아직 오답이 없어요. 시험을 풀어보세요!</div></div>`;
  }
  const items = state.wrongIds.map(id=>{
    const w = findWordById(id);
    if(!w) return '';
    return `
      <div class="wrong-item">
        <div class="wrong-hanzi">${w.hanzi}</div>
        <div class="wrong-meta"><span class="py">${w.pinyin}</span><br><span class="mn">${w.meaning}</span></div>
        <button class="btn ghost remove-wrong" data-id="${w.id}" style="padding:4px 8px;font-size:12px">제거</button>
      </div>
    `;
  }).join('');
  return `
    <div class="card">
      <div class="row between">
        <h2 style="margin:0">오답노트 (${state.wrongIds.length})</h2>
        <button class="btn" id="reviewWrong">오답만 다시 풀기</button>
      </div>
      ${items}
    </div>
  `;
}

/* ============ 이벤트 핸들러 ============ */
function attachHandlers(){
  // import
  const importArea = document.getElementById('importArea');
  if(importArea){
    importArea.oninput = (e)=>{ state.importText = e.target.value; };
  }
  const btnParse = document.getElementById('btnParse');
  if(btnParse) btnParse.onclick = ()=>{
    const text = document.getElementById('importArea').value;
    const parsed = parseBulkText(text);
    const added = importParsedWords(parsed);
    document.getElementById('importResult').innerHTML = `
      <div class="card" style="margin-top:12px;background:#fbfaf7">
        <p class="desc" style="margin:0">
          ${parsed.length}개 줄 인식됨 → <b>${added}개 단어 추가 완료</b>.
          잘못 인식된 항목은 '단어장 관리'에서 직접 수정할 수 있어요.
        </p>
      </div>
    `;
    state.importText = '';
    render();
  };
  const btnClearImport = document.getElementById('btnClearImport');
  if(btnClearImport) btnClearImport.onclick = ()=>{
    state.importText='';
    render();
  };

  // manage - add
  const btnAddWord = document.getElementById('btnAddWord');
  if(btnAddWord) btnAddWord.onclick = ()=>{
    const h = document.getElementById('addHanzi').value.trim();
    const p = document.getElementById('addPinyin').value.trim();
    const m = document.getElementById('addMeaning').value.trim();
    if(!h || !p || !m){ state.addWordError = '한자, 병음, 뜻을 모두 입력해주세요.'; render(); return; }
    state.addWordError = '';
    state.words.push({id:state.nextId++, hanzi:h, pinyin:p, meaning:m, level:null});
    saveWords(); saveNextId();
    render();
  };
  const btnSaveEdits = document.getElementById('btnSaveEdits');
  if(btnSaveEdits) btnSaveEdits.onclick = ()=>{
    document.querySelectorAll('#screen tr[data-id]').forEach(tr=>{
      const id = Number(tr.getAttribute('data-id'));
      const w = findWordById(id);
      if(!w) return;
      w.hanzi = tr.querySelector('.edit-hanzi').value.trim();
      w.pinyin = tr.querySelector('.edit-pinyin').value.trim();
      w.meaning = tr.querySelector('.edit-meaning').value.trim();
    });
    saveWords();
    state.saveMessage = '저장되었습니다.';
    render();
    setTimeout(()=>{ state.saveMessage=''; render(); }, 2000);
  };
  document.querySelectorAll('.delete-word').forEach(btn=>{
    btn.onclick = (e)=>{
      const tr = e.target.closest('tr');
      const id = Number(tr.getAttribute('data-id'));
      state.words = state.words.filter(w=>w.id!==id);
      state.wrongIds = state.wrongIds.filter(x=>x!==id);
      saveWords(); saveWrong();
      render();
    };
  });
  const btnClearAll = document.getElementById('btnClearAll');
  if(btnClearAll) btnClearAll.onclick = ()=>{
    state.confirmingClear = true;
    render();
  };
  const btnClearAllCancel = document.getElementById('btnClearAllCancel');
  if(btnClearAllCancel) btnClearAllCancel.onclick = ()=>{
    state.confirmingClear = false;
    render();
  };
  const btnClearAllConfirm = document.getElementById('btnClearAllConfirm');
  if(btnClearAllConfirm) btnClearAllConfirm.onclick = ()=>{
    state.words = [];
    state.wrongIds = [];
    state.confirmingClear = false;
    saveWords(); saveWrong();
    render();
  };

  // flashcard
  const fcCard = document.getElementById('flashCard');
  if(fcCard) fcCard.onclick = ()=>{ state.fcFlipped = !state.fcFlipped; render(); };
  const fcFlip = document.getElementById('fcFlip');
  if(fcFlip) fcFlip.onclick = ()=>{ state.fcFlipped = !state.fcFlipped; render(); };
  const fcPrev = document.getElementById('fcPrev');
  if(fcPrev) fcPrev.onclick = ()=>{
    state.fcIndex = (state.fcIndex-1+state.fcOrder.length)%state.fcOrder.length;
    state.fcFlipped = false;
    render();
  };
  const fcNext = document.getElementById('fcNext');
  if(fcNext) fcNext.onclick = ()=>{
    state.fcIndex = (state.fcIndex+1)%state.fcOrder.length;
    state.fcFlipped = false;
    render();
  };
  const fcShuffle = document.getElementById('fcShuffle');
  if(fcShuffle) fcShuffle.onchange = (e)=>{
    state.fcShuffled = e.target.checked;
    setupFlash();
    render();
  };

  // quiz
  const quizStartAll = document.getElementById('quizStartAll');
  if(quizStartAll) quizStartAll.onclick = ()=> startQuiz('all');
  const quizStartWrong = document.getElementById('quizStartWrong');
  if(quizStartWrong) quizStartWrong.onclick = ()=> startQuiz('wrong');

  const pinyinInput = document.getElementById('pinyinInput');
  if(pinyinInput) pinyinInput.oninput = (e)=>{ state.quizPinyinInput = e.target.value; };
  const checkPinyin = document.getElementById('checkPinyin');
  if(checkPinyin) checkPinyin.onclick = ()=>{
    const id = state.quizPool[state.quizIndex];
    const w = findWordById(id);
    state.quizPinyinResult = comparePinyin(state.quizPinyinInput, w.pinyin);
    state.quizPinyinChecked = true;
    if(state.quizPinyinResult!=='right') state.quizJustWrong = true;
    render();
  };
  document.querySelectorAll('.choice').forEach(btn=>{
    btn.onclick = ()=>{
      if(state.quizAnswered) return;
      const idx = Number(btn.getAttribute('data-choice'));
      state.quizSelected = state.quizChoices[idx];
      state.quizAnswered = true;
      const id = state.quizPool[state.quizIndex];
      const w = findWordById(id);
      const meaningCorrect = state.quizSelected === w.meaning;
      if(!meaningCorrect) state.quizJustWrong = true;
      const pinyinOk = state.quizPinyinResult === 'right';
      if(meaningCorrect && pinyinOk){
        state.quizScoreRight++;
      }
      if(state.quizJustWrong || !pinyinOk){
        if(!state.wrongIds.includes(id)){
          state.wrongIds.push(id);
          saveWrong();
        }
      } else {
        // 이번엔 다 맞음 -> 오답노트에서 제거
        if(state.wrongIds.includes(id)){
          state.wrongIds = state.wrongIds.filter(x=>x!==id);
          saveWrong();
        }
      }
      render();
    };
  });
  const nextQuestion = document.getElementById('nextQuestion');
  if(nextQuestion) nextQuestion.onclick = ()=>{
    state.quizIndex++;
    if(state.quizIndex>=state.quizPool.length){
      state.quizSessionOver = true;
    } else {
      prepQuizQuestion();
    }
    render();
  };
  const stopQuiz = document.getElementById('stopQuiz');
  if(stopQuiz) stopQuiz.onclick = ()=>{
    state.quizSessionOver = true;
    render();
  };

  // wrong list
  const reviewWrong = document.getElementById('reviewWrong');
  if(reviewWrong) reviewWrong.onclick = ()=>{
    goTo('quiz');
    startQuiz('wrong');
  };
  document.querySelectorAll('.remove-wrong').forEach(btn=>{
    btn.onclick = (e)=>{
      const id = Number(e.target.getAttribute('data-id'));
      state.wrongIds = state.wrongIds.filter(x=>x!==id);
      saveWrong();
      render();
    };
  });
}

loadAll();
</script>
</body>
</html>
